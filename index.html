<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030303"><meta name="description" content="BÓINN — Living Instruments"><title>BÓINN — Living Instruments</title><style>:root{--bg:#030303;--fg:#d8d6d0;--muted:#77736c;--amber:#c0782e}*{box-sizing:border-box}html{background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}body{margin:0;background:var(--bg)}a{color:inherit;text-decoration:none}header{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:24px 34px;background:linear-gradient(#030303dd,transparent)}.mini{width:112px;opacity:.45;filter:grayscale(1) brightness(1.25)}.about{font-size:12px;color:#a4a19a;letter-spacing:.05em}.hero{min-height:150vh;position:relative;padding:150px 7vw 0;overflow:hidden}.lockup{width:min(650px,70vw);opacity:.97;filter:grayscale(1) brightness(1.15)}.reveal{position:absolute;right:-5vw;top:22vh;width:min(66vw,900px);opacity:.16;mix-blend-mode:screen;filter:brightness(.45) contrast(1.35) saturate(.45)}.reveal2{position:absolute;left:-12vw;bottom:4vh;width:min(64vw,800px);opacity:.10;mix-blend-mode:screen;filter:brightness(.4) contrast(1.4) saturate(.45)}.signup{padding:12vh 7vw 8vh;max-width:1100px}.signup h2{font-size:clamp(26px,3vw,42px);font-weight:300;margin:0 0 16px;letter-spacing:-.02em}.signup p{color:var(--muted);font-size:14px;margin:0 0 28px}form{display:flex;gap:12px;max-width:760px}input{flex:1;background:#080808;border:1px solid #242424;border-radius:999px;padding:16px 20px;color:#ddd;outline:none}button{border:0;border-radius:999px;padding:16px 28px;background:#d3d0c9;color:#111;cursor:pointer}button:hover{background:#ebe7de}footer{display:flex;gap:24px;align-items:center;padding:30px 7vw 44px;color:#68645e;font-size:12px}footer .brand{margin-right:auto;width:84px;opacity:.35;filter:grayscale(1) brightness(1.2)}@media(max-width:700px){header{padding:18px 20px}.mini{width:95px}.hero{min-height:135vh;padding:120px 20px 0}.lockup{width:92vw}.reveal{width:110vw;right:-42vw;top:35vh;opacity:.14}.reveal2{width:100vw;left:-40vw;bottom:14vh}.signup{padding:10vh 20px 7vh}form{flex-direction:column}button{width:100%}footer{padding:24px 20px 36px;gap:16px;flex-wrap:wrap}}</style></head><body><header><img class="mini" src="assets/boinn-lockup.webp" alt="BÓINN"><a class="about" href="#about">about</a></header><main><section class="hero"><img class="lockup" src="assets/boinn-lockup.webp" alt="BÓINN — Living Instruments"><img class="reveal" src="assets/hardware-a.webp" alt=""><img class="reveal2" src="assets/hardware-b.webp" alt=""></section><section class="signup" id="about"><h2>Be first to hear it</h2><p>product announcements, development notes and release information.</p><form id="join"><input id="email" type="email" autocomplete="email" placeholder="your email address" required><button type="submit">Join the list</button></form><p id="status" aria-live="polite" style="margin-top:14px"></p></section></main><footer><img class="brand" src="assets/boinn-lockup.webp" alt="BÓINN"><a href="#">privacy</a><a href="mailto:hello@boinnaudio.com">contact</a><span>© 2026</span></footer><script>const f=document.getElementById('join'),s=document.getElementById('status');f.addEventListener('submit',e=>{e.preventDefault();s.textContent='mailing list connection coming shortly.'});</script></body></html>
